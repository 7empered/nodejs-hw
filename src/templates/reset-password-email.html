<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <title>Скидання пароля</title>
  </head>
  <body
    style="
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      padding: 24px;
    "
  >
    <div
      style="
        max-width: 480px;
        margin: 0 auto;
        background: #ffffff;
        border-radius: 8px;
        padding: 32px;
      "
    >
      <h2 style="color: #333333">Скидання пароля</h2>
      <p style="color: #555555; font-size: 15px; line-height: 1.5">
        Ви (або хтось інший) запросили скидання пароля для акаунта
        <strong>{{email}}</strong>. Якщо це були ви, натисніть кнопку нижче,
        щоб задати новий пароль. Посилання дійсне протягом 15 хвилин.
      </p>
      <p style="text-align: center; margin: 32px 0">
        <a
          href="{{link}}"
          style="
            background-color: #4a90e2;
            color: #ffffff;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 15px;
          "
        >
          Скинути пароль
        </a>
      </p>
      <p style="color: #999999; font-size: 13px; line-height: 1.5">
        Якщо ви не робили цього запиту, просто проігноруйте цей лист — пароль
        залишиться незмінним.
      </p>
    </div>
  </body>
</html>
